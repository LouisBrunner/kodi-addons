# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build & Deploy

on:
  push:
    branches: [main]

permissions: {}

jobs:
  test:
    name: Test
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  build:
    name: Build repository
    needs: [test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: 1.58.0

      - name: Build zips
        run: just build

      - name: Upload Pages artifact
        uses: LouisBrunner/.github/.github/actions/upload-pages@main
        with:
          path: out/

  deploy:
    name: Deploy to GitHub Pages
    needs: [build]
    permissions:
      pages: write
      id-token: write
    uses: LouisBrunner/.github/.github/workflows/deploy-pages.yml@main
