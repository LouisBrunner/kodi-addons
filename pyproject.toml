#:schema https://json.schemastore.org/pyproject.json

[project]
name = "kodi-addons"
version = "0"
description = "Addons for Kodi (XBMC) "
readme = "README.md"

[dependency-groups]
dev = ["ruff==0.16.6", "ty==0.0.80"]

[tool.ruff]
target-version = "py39"  # OSMC: 3.9, Kodi: 3.11

[tool.ruff.lint.per-file-ignores]
"vendor/*.py" = ["ALL"]

[tool.ty.src]
exclude = ["vendor"]

[tool.ty.environment]
extra-paths = ["plugin.video.dropout"]

[tool.uv.workspace]
members = ["plugin.video.dropout"]

# FIXME: we are tied to the targeted Kodi version
[tool.uv.audit]
ignore = [
  "PYSEC-2026-1872",
  "PYSEC-2026-1873",
  "PYSEC-2026-2275",
  "PYSEC-2026-4170",
  "PYSEC-2026-4171",
  "PYSEC-2026-4175",
  "PYSEC-2026-4176",
  "PYSEC-2026-4177",
  "PYSEC-2026-4320",
  # FIXME(3.9): for the older versions
  "PYSEC-2026-1845",
  "PYSEC-2026-141",
  "PYSEC-2026-142",
]
