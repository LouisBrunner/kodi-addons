#:schema https://json.schemastore.org/pyproject.json

[project]
name = "kodi-addons"
version = "0"
description = "Addons for Kodi (XBMC) "
readme = "README.md"

[dependency-groups]
dev = ["ruff==0.16.6", "ty==0.0.80"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"vendor/*.py" = ["ALL"]

[tool.ty.src]
exclude = ["vendor"]

[tool.ty.environment]
extra-paths = ["plugin.video.dropout"]

[tool.uv.workspace]
members = ["plugin.video.dropout"]
