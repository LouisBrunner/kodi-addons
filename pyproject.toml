#:schema https://json.schemastore.org/pyproject.json

[project]
name = "kodi-addons"
version = "0"
description = "Addons for Kodi (XBMC) "
readme = "README.md"
requires-python = ">=3.11.9,<3.12"

[dependency-groups]
dev = ["ruff==0.16.0", "ty==0.0.65"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["INP001", "T201"]
"vendor/*.py" = ["ALL"]

[tool.ty.src]
exclude = ["vendor"]

[tool.uv.workspace]
members = ["plugin.video.dropout"]
