#:schema https://json.schemastore.org/pyproject.json

[project]
name = "kodi-dropout"
version = "0"
description = "Kodi addon for Dropout.tv"
readme = "README.md"
requires-python = ">=3.11.9,<3.12"
dependencies = [
  "Kodistubs==21.0.0",
  "beautifulsoup4==4.12.2",
  "requests==2.31.0",
  "typing-extensions==4.7.1",
]

[dependency-groups]
dev = [
  "polib==1.2.0",
  "pytest==9.1.1",
  "responses==0.26.3",
  "time-machine==3.5.1",
  "types-requests==2.31.0.20240406",
]

[tool.pytest]
log_cli = true
log_cli_format = "%(levelname)s %(message)s"
log_cli_level = "INFO"
python_files = ["conftest.py", "test_*.py", "tests/*.py"]
verbosity_assertions = "2"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  # missing copyright notice at top of file
  "CPY001",
  # conflicting rules
  "D203",
  "D212",
  "COM812",
  # they are useful
  "FIX001",
  "FIX002",
  "TD001",
  "TD002",
  "TD003",
  # required name by Kodi
  "N999",
  # documentation
  "D",
]

[tool.ruff.lint.flake8-builtins]
ignorelist = ["id"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  # assert is how pytest checks
  "S101",
  # fake passwords and tokens
  "S105",
  "S106",
  # expected values are literals
  "PLR2004",
]

[tool.uv]
package = false
